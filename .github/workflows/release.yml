# Binaries for the three platforms, built on each of them.
#
# README.md tells people to download `varg-v<version>-linux-x64.tar.gz` from the Releases page.
# Nothing produced it: the newest release was v1.0.0, whose assets were uploaded by hand, and no
# workflow built anything. The promise was older than the thing promised.
#
# Each platform builds on its own runner rather than cross-compiling: a cross build needs the
# target's linker and C toolchain, and mimalloc and bundled SQLite both compile C.
#
# Every job also *runs* what it built. A binary that compiles is not a binary that works, and
# until now nothing had ever exercised vargc on macOS at all.
name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance: GitHub signs a statement saying which workflow, at which commit, produced
  # each archive, and records it in a public transparency log. It needs no key of ours, and
  # `gh attestation verify` checks it against the repository. This is not the same as signing the
  # binary — an unsigned executable still warns on Windows and macOS — but it is the half that
  # does not wait on a certificate.
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            exe: vargc
            ext: ""
            archive: tar.gz
          - os: macos-latest
            name: macos-arm64
            exe: vargc
            ext: ""
            archive: tar.gz
          - os: windows-latest
            name: windows-x64
            exe: vargc.exe
            ext: ".exe"
            archive: zip
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: varg-compiler
          key: release-${{ matrix.name }}

      - name: Build the compiler and the language server
        # The editor extension needs `varg-lsp`, and nothing shipped it: the extension looked for
        # a binary no release contained, started a client against it, and reported success.
        working-directory: varg-compiler
        run: cargo build -p vargc -p varg-lsp --release --locked

      - name: It runs on this platform
        shell: bash
        run: |
          V="$PWD/varg-compiler/target/release/${{ matrix.exe }}"
          "$V" --version
          work="$(mktemp -d)"
          cd "$work"
          "$V" new mcp-server smoke
          "$V" check smoke.varg | grep -q "no type errors"
          "$V" new cli tool
          "$V" check tool.varg | grep -q "no type errors"
          echo 'agent Main { public void Run() { print "built on ${{ matrix.name }}"; } }' > hello.varg
          "$V" run hello.varg | grep -q "built on ${{ matrix.name }}"

      - name: Build the tutor, and ask it something
        # Shipped as a binary, not only as source. `vargc` needs cargo to compile anything; a Varg
        # program that is already built needs nothing at all — which is the whole argument for
        # writing an MCP server in this language, and it is worth handing someone rather than
        # describing. Building it here also proves on every platform that a Varg program compiles
        # and answers there.
        shell: bash
        run: |
          V="$PWD/varg-compiler/target/release/${{ matrix.exe }}"
          "$V" build tools/varg-tutor/tutor.varg
          VARG_HOME="$PWD" VARGC="$V" "$V" mcp list tools/varg-tutor/tutor.varg | grep -q "check(source"

      # Windows code signing. Dormant until a certificate exists: the `if` reads an env var
      # set from the secret, so with no secret the step is skipped and the release is built
      # exactly as it is today. An unsigned vargc.exe makes SmartScreen warn on first run,
      # which is what the external audit flagged; the fix needs a certificate, and a
      # certificate is not something CI can produce. To switch this on, add two repository
      # secrets:
      #   WINDOWS_CERT_PFX       base64 of the .pfx  (certutil -encode cert.pfx cert.txt)
      #   WINDOWS_CERT_PASSWORD  its password
      # Nothing else changes. See docs/RELEASING.md.
      - name: Sign the Windows binaries
        if: matrix.os == 'windows-latest' && env.HAS_WINDOWS_CERT == 'true'
        env:
          HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin' -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found on this runner' }
          foreach ($exe in 'vargc.exe', 'varg-lsp.exe') {
            $path = "varg-compiler/target/release/$exe"
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $path
            if ($LASTEXITCODE -ne 0) { throw "signing $exe failed" }
          }
          Remove-Item $pfx -Force
      # An SBOM beside the provenance attestation. Provenance says which workflow produced
      # the archive; this says what is in it. When an advisory lands, "is this release affected"
      # is a question about a build that already happened, and it cannot be reconstructed
      # afterwards. Built from the lockfile with the same features the release is built with, so
      # it describes this binary and not the crate's whole dependency surface.
      - name: Software bill of materials
        shell: bash
        run: |
          cargo install cargo-cyclonedx --locked --quiet || true
          cd varg-compiler
          cargo cyclonedx --format json --all --features full || {
            echo "::warning::cargo-cyclonedx unavailable; the release ships without an SBOM"
            exit 0
          }
          cd ..
          mkdir -p sbom
          find varg-compiler -name '*.cdx.json' -exec cp {} sbom/ \; 2>/dev/null || true
          ls -la sbom || true

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then version="dev-${GITHUB_SHA:0:7}"; fi
          stage="varg-v${version}-${{ matrix.name }}"
          mkdir -p "$stage"
          cp "varg-compiler/target/release/${{ matrix.exe }}" "$stage/"
          # The language server, beside the compiler: that is where the extension looks first.
          cp "varg-compiler/target/release/varg-lsp${{ matrix.ext }}" "$stage/"
          # The runtime crates a generated program depends on. Without them the archive shipped a
          # compiler that could type-check a program and not build one: the manifest it wrote
          # pointed at a directory on the build machine. 552 KB of source, and the difference
          # between a release and a demonstration.
          # Only what cargo needs: a manifest and the sources. Copying the directories whole
          # would carry along whatever a test run happened to leave beside them.
          for c in varg-os-types varg-runtime; do
            mkdir -p "$stage/crates/$c"
            cp "varg-compiler/crates/$c/Cargo.toml" "$stage/crates/$c/"
            cp -r "varg-compiler/crates/$c/src" "$stage/crates/$c/src"
          done
          cp README.md CHANGELOG.md REFERENCE.md VARG_AGENT_GUIDE.md LICENSE "$stage/"
          # The SBOM travels with the archive it describes; separated they are two guesses.
          if [ -d sbom ] && [ -n "$(ls -A sbom 2>/dev/null)" ]; then
            mkdir -p "$stage/sbom"
            cp sbom/*.json "$stage/sbom/"
          fi
          # Only the Varg. `examples/` also holds the Rust each one transpiles to, which is
          # build output, not something anyone downloads a release to read.
          mkdir -p "$stage/examples" "$stage/tools/varg-tutor" "$stage/golden/progs"
          cp examples/*.varg "$stage/examples/"
          cp tools/varg-tutor/tutor.varg tools/varg-tutor/README.md "$stage/tools/varg-tutor/"
          # The tutor, already built: it runs without cargo, unlike vargc itself.
          cp "tutor${{ matrix.ext }}" "$stage/tools/varg-tutor/"
          # What its `example` tool answers from: programs CI builds and runs.
          cp golden/progs/*.varg "$stage/golden/progs/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${stage}.zip" "$stage" >/dev/null
            asset="${stage}.zip"
          else
            tar czf "${stage}.tar.gz" "$stage"
            asset="${stage}.tar.gz"
          fi
          # A checksum beside each archive, so an installer or the self-updater can tell whether
          # what it downloaded is what was built. Nothing published one before, and neither the
          # installer nor `vargc upgrade` checked anything.
          # The branch above knows which archive it made. Asking `ls` for both and taking the
          # first looked tidier and killed the step: `ls a.zip a.tar.gz` with one of them absent
          # exits 2, and under `set -e -o pipefail` that ends the job — silently, because the
          # error went to /dev/null. Packaging had been broken on all three platforms since this
          # line was written, and nothing ran the release workflow to find out.
          echo "asset=${asset}" >> "$GITHUB_ENV"
          # The standard two-field format, `<hash>  <filename>`. It used to be the hash alone,
          # which `sha256sum -c` refuses with "no properly formatted checksum lines found" — so
          # the file published for people to verify with could not be used by the tool they would
          # reach for. Our own readers (both installers, `vargc upgrade`) take the first
          # whitespace-separated token, so they are unaffected.
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          cat "${asset}.sha256"
          ls -la "$stage".*
          echo "stage=${stage}" >> "$GITHUB_ENV"

      - name: Package the editor extension
        # One VSIX for every platform, built once. `vsce` prunes dev dependencies but keeps the
        # language client, without which the extension cannot start.
        if: matrix.name == 'linux-x64'
        working-directory: varg-vscode
        run: |
          npm ci || npm install
          npm run compile
          npx --yes @vscode/vsce package --allow-missing-repository
          ls -la *.vsix

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'linux-x64'
        with:
          name: varg-vscode
          path: varg-vscode/*.vsix
          if-no-files-found: error

      - name: The packaged release builds a program
        # The step above this one tested `vargc run` inside the checkout, where the runtime crates
        # happen to be lying around. That is not what anyone downloads. This unpacks the archive
        # somewhere else and asks it to build something — which v2.2.0 could not do.
        shell: bash
        run: |
          out="$(mktemp -d)"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z x -o"$out" "${{ env.asset }}" >/dev/null
          else
            tar xzf "${{ env.asset }}" -C "$out"
          fi
          bash release/smoke.sh "$out/${{ env.stage }}"

      - uses: actions/upload-artifact@v4
        with:
          name: varg-${{ matrix.name }}
          path: |
            ${{ env.asset }}
            ${{ env.asset }}.sha256
          if-no-files-found: error

  fresh-machine:
    # The acceptance criterion behind P0-01: install on a machine that has never seen this
    # repository, and build a program on it. `release/smoke.sh` runs on the build machine, which
    # has the checkout, a warm cargo registry and every toolchain the build needed — and P0-01 was
    # precisely a dependency that happened to be lying around. Here nothing is: a bare Debian
    # image, curl, a linker, rustup, and the archive.
    name: A bare machine can install it and build
    needs: build
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    steps:
      - name: What a user would already have, and nothing more
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl tar gzip gcc libc6-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable

      - uses: actions/download-artifact@v4
        with:
          name: varg-linux-x64
          path: /dl

      - name: Install, and check what was installed
        run: |
          set -eux
          . "$HOME/.cargo/env"
          # The checksum first: the installer verifies it, so the test standing in for the
          # installer has to as well. Checked where the files are, because the .sha256 names the
          # archive without a path.
          cd /dl && sha256sum -c ./*.sha256
          cd /opt
          tar xzf /dl/*.tar.gz
          mv varg-v*-linux-x64 varg
          echo "/opt/varg" >> "$GITHUB_PATH"

      - name: The six commands, in an empty directory
        run: |
          set -eux
          . "$HOME/.cargo/env"
          export PATH="/opt/varg:$PATH"
          mkdir -p /work && cd /work
          vargc --version
          vargc new agent hello
          vargc check hello.varg
          # No warnings from the generated Rust: a user should never have to read one.
          out="$(vargc build hello.varg 2>&1)"
          echo "$out"
          if echo "$out" | grep -q "^warning:"; then
            echo "the generated program built with warnings"
            exit 1
          fi
          ./hello

      - name: The built program runs with Varg and Rust removed
        run: |
          set -eux
          cp /work/hello /tmp/hello
          rm -rf /opt/varg "$HOME/.cargo" "$HOME/.rustup"
          /tmp/hello
          echo "  a native binary, and nothing left to install"

  release:
    name: Draft the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: ls -la assets

      # The tag itself. An external audit found the v2.2.0 tag unsigned, so nothing tied the
      # release to a person. Signing happens on the machine that creates the tag, not here, so
      # all CI can do is say whether it was done — and say it out loud rather than silently
      # shipping an anonymous tag. Not fatal: it reports, and the release is a draft anyway.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is the tag signed
        run: |
          if git verify-tag "${GITHUB_REF_NAME}" 2>/dev/null; then
            echo "Tag ${GITHUB_REF_NAME} carries a valid signature."
          else
            echo "::warning::Tag ${GITHUB_REF_NAME} is not signed. Create it with"
            echo "::warning::  git tag -s ${GITHUB_REF_NAME} -m 'Varg ${GITHUB_REF_NAME}'"
            echo "::warning::after configuring user.signingkey and gpg.format."
          fi

      - name: Attest what built these archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'assets/*.zip,assets/*.tar.gz,assets/*.vsix'
      # A draft, not a publication: the artifacts are attached and someone decides to release
      # them. Publishing is an outward-facing act and does not belong to a push.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: assets/*
          generate_release_notes: true
