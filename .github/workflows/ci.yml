name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    # The Cargo workspace lives in a subdirectory.
    working-directory: varg-compiler

jobs:
  # Fast gate: default features. This is what `cargo test --workspace` runs locally.
  test:
    name: Test (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: varg-compiler
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked

  # Full gate: every optional runtime feature compiled and tested together.
  # These feature-gated modules (crypto, encoding, pdf, llm, tensor, dataframe,
  # fts, duckdb, ...) are NOT compiled by the default `cargo test` run, so without
  # this job a break in them regresses silently.
  test-full:
    name: Test (--features full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: varg-compiler
          key: full
      - name: Build runtime (all features)
        # `duckdb`/`polars`/`tantivy`/`reqwest` pull heavy deps; build-essential and
        # libssl-dev are present on ubuntu-latest runners.
        run: cargo build -p varg-runtime --features full --locked
      - name: Test runtime (all features)
        run: cargo test -p varg-runtime --features full --locked

  # Individual-feature gate. `default` and `full` both hid the case where a feature
  # is enabled *on its own*: e.g. a test under `server` used reqwest without the
  # `net` gate, so `--features server` alone did not compile — invisible to the two
  # jobs above, and exactly what a user enabling one feature would hit.
  test-single-features:
    name: Compile (one feature at a time)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: varg-compiler
          key: single-features
      - name: Check each feature in isolation
        working-directory: varg-compiler
        run: |
          set -e
          for f in net server db llm ws pdf crypto encoding tensor ann; do
            echo "::group::--features $f"
            cargo test -p varg-runtime --features "$f" --lib --no-run --locked
            echo "::endgroup::"
          done

  # End-to-end gate. The two suites below are the ones that catch what unit tests structurally
  # cannot, and neither ran in CI before:
  #
  #   golden/  builds and RUNS each program and diffs its stdout. Unit tests assert that Rust is
  #            generated, rarely what the program then computes — which is how `abs(-5.0)`
  #            returning -5 and a silently dropped agent message both survived a green suite.
  #
  #   probes/  the backward direction: every program there must be REJECTED, and rejected by
  #            Varg's own front end rather than by rustc against generated code. Running it over
  #            the whole accumulated set is what caught two regressions introduced by earlier
  #            rounds of typechecker work, plus an abs() that truncated floats.
  #
  # Both need a built vargc, so they share one job.
  end-to-end:
    name: Golden output + rejection probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: varg-compiler
          key: e2e
      # vargc builds every generated program into ~/.cache/varg/target, shared across programs
      # but not across runs. Nothing cached it, so each run recompiled axum, polars, duckdb and
      # tantivy from scratch for the golden suite -- 21 minutes against 85 seconds locally, and
      # growing with every golden program added.
      - name: Cache generated-program builds
        uses: actions/cache@v4
        with:
          path: ~/.cache/varg/target
          key: varg-progs-${{ runner.os }}-${{ hashFiles('varg-compiler/crates/varg-runtime/Cargo.toml', 'varg-compiler/Cargo.lock') }}
          restore-keys: |
            varg-progs-${{ runner.os }}-
      - name: Build vargc (release)
        run: cargo build -p vargc --release --locked
      - name: Known vulnerabilities, and the reasons the two skipped ones are safe
        # An external audit found nine, four of them in the TLS crate the compiler itself links.
        # Nothing had ever looked. Two remain. They used to be two bare --ignore flags: a flag
        # records a decision without its reason, so it outlives the reason. security/advisories.sh
        # states the precondition behind each skip and fails when it stops holding — rkyv leaving
        # the lockfile for the build graph, or the PDF writer gaining a reader.
        # The workflow defaults every step into varg-compiler/; this one runs from the root.
        working-directory: .
        run: |
          cargo install cargo-audit --locked --quiet || true
          bash security/advisories.sh
      - name: Documentation compiles, covers the builtins, and its prose holds
        # Four rounds found the same defect: a signature in REFERENCE.md or VARG_AGENT_GUIDE.md
        # that the compiler rejects. Nothing caught it because nothing fed the docs to the
        # compiler. Cheap (check only), so it runs before the builds.
        working-directory: .
        run: VARGC="$PWD/varg-compiler/target/release/vargc" python3 docs-check/check.py
      - name: Rejection probes
        # Cheap (parse + typecheck only), so it runs first: a front end that stopped catching
        # something is worth knowing before spending minutes on full builds.
        working-directory: .
        run: VARGC="$PWD/varg-compiler/target/release/vargc" bash probes/run.sh
      - name: Golden output
        working-directory: .
        run: VARGC="$PWD/varg-compiler/target/release/vargc" bash golden/run.sh
      - name: The tutor builds and answers
        # An MCP server written in Varg that teaches Varg. It is the clearest demonstration of
        # what the language is for, so it has to keep working.
        working-directory: .
        run: |
          V="$PWD/varg-compiler/target/release/vargc"
          "$V" build tools/varg-tutor/tutor.varg
          VARG_HOME="$PWD" VARGC="$V" "$V" mcp list tools/varg-tutor/tutor.varg | grep -q "check(source"
          VARG_HOME="$PWD" VARGC="$V" "$V" mcp call tools/varg-tutor/tutor.varg check             '{"source": "agent Main { public void Run() { print \"hi\"; } }"}' | grep -q "no type errors"
      - name: A generated program compiles without warnings
        # rustc's complaints about *generated* Rust reached the author of the Varg: `unnecessary
        # unsafe block` for a capability marker, `should have a snake case name` for a method they
        # named, `denote infinite loops with loop` for a `while true` they wrote. None of it was
        # theirs to act on. The README claimed "0 warnings" while this was happening.
        working-directory: .
        run: |
          V="$PWD/varg-compiler/target/release/vargc"
          work="$(mktemp -d)"
          cd "$work"
          "$V" new mcp-server clean >/dev/null
          out="$("$V" build clean.varg 2>&1)"
          if echo "$out" | grep -q "^warning:"; then
            echo "$out" | grep "^warning:"
            echo
            echo "A program built by vargc must not make its author read warnings about Rust."
            exit 1
          fi
      - name: WebAssembly target still builds
        # `vargc build --target wasm32-wasip1` is in `vargc --help` and could never work: the
        # manifest declared a cdylib while only src/main.rs was written, and rusqlite was an
        # unconditional dependency so libsqlite3-sys tried to build its bundled C for wasm32.
        # Nothing ran it, which is why nobody noticed. Now something does.
        working-directory: .
        run: |
          rustup target add wasm32-wasip1
          work="$(mktemp -d)"
          echo 'agent Main { public void Run() { print "hi from wasm"; } }' > "$work/hello.varg"
          cd "$work"
          "$GITHUB_WORKSPACE/varg-compiler/target/release/vargc" build --target wasm32-wasip1 hello.varg
          test -s hello.wasm
          test "$(head -c 4 hello.wasm | tail -c 3)" = asm